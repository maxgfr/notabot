name: Production checks

# The deployed site and the published package, as visitors and users get them: after each
# GitHub Pages deployment and npm release, every morning, and on demand.
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages, Publish to npm]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  site:
    name: Site and script on GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # GitHub Pages serves a new deployment after a short delay.
      - if: github.event_name == 'workflow_run'
        run: sleep 60
      - run: bun run test:live
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-results
          path: test-results/
          retention-days: 7

  package:
    name: Package on npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The latest release tag, checked out: its own check script against its own package, never a
      # newer script against whatever `latest` points at while the registry catches up.
      - name: Version to check
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          git checkout --quiet "$tag"
          echo "NOTABOT_VERSION=$tag" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run test:package:published
      - run: bunx playwright install --with-deps chromium
      - name: The published package, installed by a consumer app, end to end
        run: bun run test:package:e2e:published
        env:
          CI: "true"
