name = "notabot"
main = "worker.ts"
compatibility_date = "2026-10-01"

# wrangler secret put NOTABOT_HMAC_KEY
# wrangler secret put NOTABOT_SITE_SECRET
# Optional model, OpenAI-compatible (OpenRouter, Groq, your own vLLM...):
# wrangler secret put LLM_API_KEY
[vars]
ALLOWED_ORIGINS = "https://example.com"
# LLM_ENDPOINT = "https://openrouter.ai/api/v1"
# LLM_MODEL = "anthropic/claude-haiku-5.5"

# Refuse replayed puzzles and tokens across isolates:
# [[kv_namespaces]]
# binding = "NOTABOT_KV"
# id = "<your namespace id>"
